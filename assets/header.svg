<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">security-audit</title>
  <desc id="desc">Local code security scanning with redacted findings and practical remediation.</desc>
